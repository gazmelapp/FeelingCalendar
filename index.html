<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8fb">
  <meta name="description" content="毎日の気分を5段階の顔マークと一言メモで記録する、オフライン対応の気分カレンダー">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./style.css">
  <title>気分カレンダー</title>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1><span class="title-cloud" aria-hidden="true">☁</span> 気分カレンダー</h1>
      </div>
      <button id="todayBtn" class="quiet-btn" type="button">今日へ</button>
    </header>

    <section class="month-panel" aria-label="カレンダー">
      <div class="month-nav">
        <button id="prevMonth" class="nav-btn" type="button" aria-label="前の月">‹</button>
        <h2 id="monthTitle" aria-live="polite"></h2>
        <button id="nextMonth" class="nav-btn" type="button" aria-label="次の月">›</button>
      </div>
      <div class="weekdays" aria-hidden="true">
        <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
    </section>

    <section class="trend-panel" aria-labelledby="trendTitle">
      <div class="trend-heading"><div><h2 id="trendTitle">月ごとの気分の推移</h2><p class="trend-subtitle">日々の記録から月平均を表示します</p></div></div>
      <div class="trend-summary" id="trendSummary">月平均を計算しています</div>
      <div class="chart-wrap"><svg id="moodChart" class="mood-chart" viewBox="0 0 600 250" role="img" aria-label="月ごとの気分平均の折れ線グラフ"></svg></div>
      <p class="chart-help">過去の月の点をタップすると、一時的な管理用の月平均値を登録できます。</p>
      <div class="chart-legend"><span><i class="legend-line"></i>日々の記録から計算</span><span><i class="legend-manual"></i>手動登録値</span></div>
    </section>

    <dialog id="entryDialog" class="entry-dialog" aria-labelledby="entryTitle">
    <section class="entry-panel" aria-labelledby="entryTitle">
      <div class="entry-heading">
        <div>
          <h2 id="entryTitle">今日の気分</h2>
        </div>
        <button id="closeEntryBtn" class="close-entry-btn" type="button" aria-label="閉じる">×</button>
        <span id="savedBadge" class="saved-badge" hidden>保存済み</span>
      </div>
      <p class="field-label">今日はどんな気分でしたか？</p>
      <div class="mood-options" role="group" aria-label="気分を5段階から選択">
        <button class="mood-btn mood-1" data-mood="1" type="button" aria-label="とても悪い"><img class="face face-1" src="./mood-1.svg" alt=""><small>つらい</small></button>
        <button class="mood-btn mood-2" data-mood="2" type="button" aria-label="悪い"><img class="face face-2" src="./mood-2.svg" alt=""><small>いまいち</small></button>
        <button class="mood-btn mood-3" data-mood="3" type="button" aria-label="普通"><img class="face face-3" src="./mood-3.svg" alt=""><small>ふつう</small></button>
        <button class="mood-btn mood-4" data-mood="4" type="button" aria-label="良い"><img class="face face-4" src="./mood-4.svg" alt=""><small>よい</small></button>
        <button class="mood-btn mood-5" data-mood="5" type="button" aria-label="とても良い"><img class="face face-5" src="./mood-5.svg" alt=""><small>最高</small></button>
      </div>
      <label class="field-label" for="noteInput">一言メモ <span class="optional">任意</span></label>
      <textarea id="noteInput" rows="3" maxlength="300" placeholder="今日あったこと、感じたことなど…"></textarea>
      <div class="entry-actions">
        <button id="deleteBtn" class="delete-btn" type="button" hidden>記録を削除</button>
        <button id="saveBtn" class="primary-btn" type="button" disabled>記録を保存</button>
      </div>
      <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>
    </section>
    </dialog>
    <dialog id="monthlyValueDialog" class="entry-dialog monthly-value-dialog" aria-labelledby="monthlyValueTitle">
      <section class="entry-panel">
        <div class="entry-heading"><h2 id="monthlyValueTitle">月平均の登録</h2><button id="closeMonthlyBtn" class="close-entry-btn" type="button" aria-label="閉じる">×</button></div>
        <p id="monthlyValueDescription" class="field-label">月の値を入力してください</p>
        <label class="field-label" for="monthlyValueInput">月平均（-2.0〜2.0）</label>
        <input id="monthlyValueInput" class="monthly-value-input" type="number" min="-2" max="2" step="0.1" inputmode="decimal">
        <p class="chart-help">この値は日々の記録とは別に保存され、グラフでは手動登録値として表示されます。日々の記録は変更されません。</p>
        <div class="entry-actions"><button id="saveMonthlyBtn" class="primary-btn" type="button">月平均を登録</button><button id="deleteMonthlyBtn" class="delete-btn" type="button">手動登録を解除</button></div>
        <p id="monthlyStatus" class="status-message" role="status"></p>
      </section>
    </dialog>
  </main>
  <script src="./app.js"></script>
</body>
</html>
