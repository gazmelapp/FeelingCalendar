<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ee">
  <meta name="description" content="毎日の気分を5段階の顔マークと一言メモで記録する、オフライン対応の気分カレンダー">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <title>気分カレンダー</title>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">MY DAILY JOURNAL</p>
        <h1>気分カレンダー <span aria-hidden="true">🌿</span></h1>
      </div>
      <button id="todayBtn" class="quiet-btn" type="button">今日へ</button>
    </header>

    <section class="month-panel" aria-label="カレンダー">
      <div class="month-nav">
        <button id="prevMonth" class="nav-btn" type="button" aria-label="前の月">‹</button>
        <h2 id="monthTitle" aria-live="polite"></h2>
        <button id="nextMonth" class="nav-btn" type="button" aria-label="次の月">›</button>
      </div>
      <div class="weekdays" aria-hidden="true">
        <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
      <div class="legend"><span>気分：</span><span>😢</span><span>🙁</span><span>😐</span><span>🙂</span><span>😄</span></div>
    </section>

    <section class="entry-panel" aria-labelledby="entryTitle">
      <div class="entry-heading">
        <div>
          <p class="eyebrow">DAILY CHECK-IN</p>
          <h2 id="entryTitle">今日の気分</h2>
        </div>
        <span id="savedBadge" class="saved-badge" hidden>保存済み</span>
      </div>
      <p class="field-label">今日はどんな気分でしたか？</p>
      <div class="mood-options" role="group" aria-label="気分を5段階から選択">
        <button class="mood-btn" data-mood="1" type="button" aria-label="とても悪い">😢<small>つらい</small></button>
        <button class="mood-btn" data-mood="2" type="button" aria-label="悪い">🙁<small>いまいち</small></button>
        <button class="mood-btn" data-mood="3" type="button" aria-label="普通">😐<small>ふつう</small></button>
        <button class="mood-btn" data-mood="4" type="button" aria-label="良い">🙂<small>よい</small></button>
        <button class="mood-btn" data-mood="5" type="button" aria-label="とても良い">😄<small>最高</small></button>
      </div>
      <label class="field-label" for="noteInput">一言メモ <span class="optional">任意</span></label>
      <textarea id="noteInput" rows="3" maxlength="300" placeholder="今日あったこと、感じたことなど…"></textarea>
      <div class="entry-actions">
        <button id="deleteBtn" class="delete-btn" type="button" hidden>記録を削除</button>
        <button id="saveBtn" class="primary-btn" type="button" disabled>記録を保存</button>
      </div>
      <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>
    </section>

    <footer>
      <p>記録はこのiPhone内に保存されます。</p>
      <p>インターネット接続なしでも、読み込み済みのアプリを利用できます。</p>
      <button id="installHelpBtn" class="text-btn" type="button">ホーム画面への追加方法</button>
      <div id="installHelp" class="install-help" hidden>
        <p><strong>iPhone（Safari）での追加手順</strong></p>
        <ol>
          <li>Safariでこのアプリを開きます。</li>
          <li>共有ボタン（四角から上向き矢印）をタップします。</li>
          <li>「ホーム画面に追加」を選び、追加します。</li>
        </ol>
      </div>
    </footer>
  </main>
  <script src="./app.js"></script>
</body>
</html>
